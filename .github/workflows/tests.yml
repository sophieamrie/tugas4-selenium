name: Selenium Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependensi
        run: pip install -r requirements.txt

      - name: Jalankan tes (headless, paralel)
        env:
          HEADLESS: "1"
        run: pytest -n 4 -v

      - name: Simpan laporan HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-html
          path: reports/report.html